; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:dash-cluster]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_upload.before_reset = usb_reset
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304
board_build.partitions = partitions_custom.csv
board_build.filesystem = littlefs
board_build.f_cpu = 240000000L
; Compiles data/www/index.html into the firmware (src/config/StudioPage.h),
; so the studio updates with a normal flash - no uploadfs, which would
; replace the layout and touch calibration on the device.
extra_scripts = pre:tools/embed_studio.py
build_flags = 
	-D LGFX_USE_QSPI
	-D BOARD_HAS_PSRAM
	-D LV_CONF_INCLUDE_SIMPLE
	-I include
	-I src
	-I src/hal
	-I src/telemetry
	-I src/ui
	-I src/config
	-D ARDUINO_USB_MODE=1
	-D ARDUINO_USB_CDC_ON_BOOT=1
	-D CORE_DEBUG_LEVEL=3
	-D FIRMWARE_VERSION=\"1.0.0\"
	-O2
lib_deps = 
	lvgl/lvgl@8.4.0
	lovyan03/LovyanGFX@1.2.27
	bblanchon/ArduinoJson@7.4.3
	moononournation/GFX Library for Arduino@1.4.9
