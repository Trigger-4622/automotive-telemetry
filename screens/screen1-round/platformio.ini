; =============================================================================
;  ESP32-C3 Round Telemetry Display — SLAVE NODE ("Intelligent Canvas")
;  ---------------------------------------------------------------------------
;  Target : All-in-one circular board — ESP32-C3 (RISC-V @160 MHz) with an
;           integrated 1.28" 240x240 GC9A01 IPS panel + CST816S capacitive
;           touch controller + native USB-C.
;
;  Build  : pio run
;  Flash  : pio run -t upload
;  Assets : pio run -t uploadfs      <-- REQUIRED once! Uploads data/ (layout,
;                                        web studio) into the LittleFS partition.
;  Monitor: pio device monitor
; =============================================================================

[env:slave-display]
platform  = espressif32@6.9.0        ; Pinned: Arduino core 2.0.17 (stable ESP-NOW
                                     ; recv-callback signature; code also supports
                                     ; core 3.x via ESP_ARDUINO_VERSION guards).
board     = esp32-c3-devkitm-1
framework = arduino

monitor_speed = 115200
upload_speed  = 921600

; This board talks over the C3's native USB-serial-JTAG, where the classic
; DTR/RTS auto-reset does not reliably enter download mode — uploads fail with
; "Wrong boot mode detected (0xc)". usb_reset drives the USB peripheral's own
; reset path instead, which works without touching the BOOT button.
board_upload.before_reset = usb_reset

; ---------------------------------------------------------------------------
; Flash layout — custom table: 1.875 MB app + 2 MB LittleFS (assets/layout/web)
; ---------------------------------------------------------------------------
board_build.partitions  = partitions_custom.csv
board_build.filesystem  = littlefs
board_build.f_cpu       = 160000000L

; Compiles data/www/index.html into the firmware (src/config/StudioPage.h),
; so the studio updates with a normal flash - no uploadfs, which would
; replace the layout on the device.
extra_scripts = pre:tools/embed_studio.py

build_flags =
    ; --- LVGL configuration -------------------------------------------------
    ; lv_conf.h lives in include/ and is found via the simple-include mechanism.
    -D LV_CONF_INCLUDE_SIMPLE
    ; --- Source layout ------------------------------------------------------
    ; src/ is grouped by responsibility (hal / telemetry / ui / config). Every
    ; group is on the include path so modules can #include "Peer.h" without
    ; relative "../" chains. PlatformIO compiles src/ recursively by default,
    ; so no build_src_filter entry is needed for the subdirectories.
    -I include
    -I src
    -I src/hal
    -I src/telemetry
    -I src/ui
    -I src/config
    ; --- Native USB-C serial console ---------------------------------------
    ; The all-in-one board exposes the C3's built-in USB-serial-JTAG on its
    ; USB-C port; route Serial there so logs appear with no external UART.
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    ; --- Misc ---------------------------------------------------------------
    ; Level 3 (INFO) keeps the bring-up logs — LittleFS mount result, panel
    ; init, ESP-NOW state — visible on the USB console. Drop to 1 (ERROR) for
    ; a production build if you want the flash back.
    -D CORE_DEBUG_LEVEL=3
    -D FIRMWARE_VERSION=\"1.0.0\"
    -O2

lib_deps =
    ; UI engine — v8.3 LTS line (all UIBuilder code uses v8 API)
    lvgl/lvgl@8.4.0
    ; Display driver — panel/bus configured in C++ (DisplayManager.h) so ALL
    ; pins stay centralized in HardwareConfig.h (no scattered -D pin flags).
    lovyan03/LovyanGFX@1.2.27
    ; layout.json parsing + REST payloads (v7 API)
    bblanchon/ArduinoJson@7.4.3

; WebServer / DNSServer / LittleFS / WiFi / esp_now ship with the Arduino core.
