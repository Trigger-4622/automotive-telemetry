; =============================================================================
;  CAN Telemetry Bridge — MASTER NODE ("Data Firehose")
;  ---------------------------------------------------------------------------
;  Target : ESP32-S3 DevKit (dual-core) + SN65HVD230 / TJA1051 CAN
;           transceiver on the built-in TWAI controller.
;
;           Serial is plain UART0 over the board's CH343 bridge, so no
;           ARDUINO_USB_CDC_ON_BOOT here and no usb_reset workaround — the
;           bridge does normal DTR/RTS auto-reset.
;  Role   : CAN in → parse → engineering units → ESP-NOW broadcast out.
;           Zero UI knowledge. See MASTER_NODE_BLUEPRINT.md.
;
;  This is a SEPARATE PlatformIO project — open this folder on its own.
; =============================================================================

[env:master-bridge]
platform  = espressif32@6.9.0
board     = esp32-s3-devkitc-1

; ESP32-S3, not the classic ESP32 the blueprint was written around. The TWAI
; controller and driver API are identical, and both CAN pins route through the
; GPIO matrix on either chip, so nothing in the firmware changes — only the
; target. Flash is 16 MB on this module; the stock DevKitC definition assumes
; 8 MB, and a wrong flash-size header in the bootloader causes a boot loop.
board_upload.flash_size   = 16MB
board_upload.maximum_size = 16777216

; Config lives in a LittleFS file the firmware writes itself; nothing is
; ever uploaded to it, so there is no `uploadfs` step for this node.
board_build.filesystem    = littlefs
framework = arduino

monitor_speed = 115200
upload_speed  = 921600

build_flags =
    -I include
    ; Level 3 (INFO). At level 1 only log_e survives, which silently removed
    ; the TWAI mode, the ESP-NOW channel and the master's own MAC from the boot
    ; log - exactly the three things needed to bring the bus up.
    -D CORE_DEBUG_LEVEL=3
    -D FIRMWARE_VERSION=\"1.0.0\"
    -O2

lib_deps =
    ; Config serialisation and the portal's REST payloads. WebServer,
    ; DNSServer, Preferences, WiFi and TWAI all ship with the Arduino core.
    bblanchon/ArduinoJson@7.4.3
