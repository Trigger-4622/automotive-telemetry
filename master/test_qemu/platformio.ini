; =============================================================================
;  The master firmware for Espressif's QEMU (machine esp32s3) - a TEST build.
;  NEVER flash it: it has no radio and no CAN bus (see README.md).
;
;  The same sources and the same compiler flags as ../platformio.ini, plus
;  shim/qemu_shim.cpp, which the linker puts in place of what QEMU does not
;  emulate (-Wl,--wrap): the Wi-Fi radio and the CAN controller's frames.
; =============================================================================
[platformio]
src_dir     = ../src
include_dir = ../include
default_envs = master-qemu

[env:master-qemu]
platform  = espressif32@6.9.0
board     = esp32-s3-devkitc-1
board_upload.flash_size   = 16MB
board_upload.maximum_size = 13107200
board_build.filesystem    = littlefs
; QEMU reads flash two bytes off in quad (QIO) mode - the firmware's own reads,
; not the boot loader's - which made every file system unreadable. Dual (DIO)
; reads are right, so the test build uses them; the master's own stays QIO.
board_build.flash_mode    = dio
; Not the board's table: a 12.5 MB app partition for a recorded drive (--replay),
; the settings partition and a smaller "logs" partition (partitions_qemu.csv).
board_build.partitions    = partitions_qemu.csv
framework = arduino

build_src_filter = +<*> +<../test_qemu/shim/>

build_flags =
    -I ../include
    -D CORE_DEBUG_LEVEL=3
    -D FIRMWARE_VERSION=\"1.0.0\"
    -O2
    -Wl,--wrap=esp_restart_noos
    ; --- the clock starts at 0 on every boot, as the board's does
    -Wl,--wrap=esp_timer_get_time
    ; --- what QEMU does not emulate -------------------------------------
    -Wl,--wrap=twai_receive
    -Wl,--wrap=twai_transmit
    -Wl,--wrap=esp_now_init
    -Wl,--wrap=esp_now_add_peer
    -Wl,--wrap=esp_now_register_send_cb
    -Wl,--wrap=esp_now_send
    -Wl,--wrap=esp_wifi_set_max_tx_power
    -Wl,--wrap=esp_wifi_set_channel
    -Wl,--wrap=_ZN9WebPortal5beginEv
    -Wl,--wrap=_ZN9WebPortal4loopEv
    -Wl,--wrap=_ZN16WiFiGenericClass4modeE11wifi_mode_t
    -Wl,--wrap=_ZN12WiFiSTAClass10disconnectEbb
    ; --- the car's settings file, applied after the master's own (--settings)
    -Wl,--wrap=_ZN12MasterConfig5beginEv
    ${sysenv.QEMU_SHIM_FLAGS}

lib_deps =
    bblanchon/ArduinoJson@7.4.3

; run.py --ota: the board's own partition table (two 3.2 MB app slots, the
; settings where they are on the board, 8 MB of drive logs) for the firmware
; update test. Too small for a recorded drive.
[env:master-qemu-ota]
extends = env:master-qemu
board_upload.maximum_size = 3342336
board_build.partitions    = ../partitions_16mb.csv
