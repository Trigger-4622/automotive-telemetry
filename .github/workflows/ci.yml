# Every pull request and every push to main: the sync checks and the host
# tests (master in a simulated car, both screens rendered with real LVGL)
# must pass, and all three firmwares must build. Claude's cloud sessions open
# pull requests, so these are also the checks Auto-fix watches.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests - ${{ matrix.suite }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        suite: [sync, master, screen1, screen2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compilers and libraries
        if: matrix.suite != 'sync'
        run: SKIP_PIO=1 bash scripts/cloud-setup.sh --force
      - name: Run
        run: python scripts/test_all.py ${{ matrix.suite }}
      - name: Keep the rendered screenshots
        if: always() && startsWith(matrix.suite, 'screen')
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ matrix.suite }}
          path: screens/*/test_host/shots/
          if-no-files-found: ignore

  firmware:
    name: Build - ${{ matrix.project }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        project: [master, screens/screen1-round, screens/screen2-cluster]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles(format('{0}/platformio.ini', matrix.project)) }}
      - run: pip install platformio
      - run: pio run -d ${{ matrix.project }}
